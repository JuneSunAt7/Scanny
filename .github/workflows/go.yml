name: Go CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ] # ← Включает запуск при создании тегов версий (например, v0.0.1)
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build
      run: go build -v ./...
    
    - name: Test
      run: go test -v ./...

  cross-compile:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
      working-directory: src
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        go build -v -o ../scanny-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: scanny-${{ matrix.goos }}-${{ matrix.goarch }}
        path: scanny-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

  release:
    needs: cross-compile
    if: startsWith(github.ref, 'refs/tags/v') # ← Выполняется только для тегов версий
    runs-on: ubuntu-latest
    permissions:
      contents: write # ← Разрешение для создания релиза и загрузки файлов
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-artifacts # ← Скачивает все 6 папок в одну директорию
    
    - name: Prepare assets for release
      run: |
        mkdir release-assets
        # Копируем бинарники из подпапок в одну общую папку
        find all-artifacts -type f -exec cp {} release-assets/ \;
        ls -la release-assets
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        fail_on_unmatched_files: true
